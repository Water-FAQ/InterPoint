name: Предложить улучшение
description: Предложите новый расчётный сценарий или улучшение InterPoint
title: "[Предложение] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Чего сейчас не хватает?
      description: Опишите задачу или неудобство, которое должно быть решено.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Опишите желаемое поведение и, если возможно, приведите пример.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Категория
      options:
        - Методы и вычисления
        - График
        - Экспорт Excel
        - Интерфейс и управление
        - Другое
    validations:
      required: true
